<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>add me!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: #1a1a1a;
      padding: 60px 40px;
      border: 2px solid #fff;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
      max-width: 500px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 15px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #111;
      background: #fff;
      text-decoration: none;
      border-radius: 8px;
      border: 2px solid #fff;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #111;
      color: #fff;
      transform: scale(1.05);
    }

    .logo {
      font-size: 4rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">💵</div>
    <h1>Add Me!</h1>
    <p>Click the button below to visit Roblox and send me a friend request.</p>
    <a class="btn" href="https://www.robiox.com.py/users/115637135125/profile" target="_blank">
      Add Me !!!!
    </a>
  </div>
</body>
</html>
