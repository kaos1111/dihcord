<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Discord</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="login-box">
    <h1>Welcome Back</h1>
    <input id="usernameInput" placeholder="Enter username"/>
    <button onclick="enterApp()">Enter Chat</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="server-icon">#</div>
  </div>

  <!-- CHANNELS -->
  <div class="channels">
    <h3>Channels</h3>
    <div class="channel active" onclick="switchRoom('general')"># general</div>
    <div class="channel" onclick="switchRoom('random')"># random</div>
  </div>

  <!-- CHAT -->
  <div class="chat">

    <div id="messages" class="messages"></div>
    <div id="typing"></div>

    <div class="input-bar">
      <button onclick="toggleGifPanel()">GIF</button>
      <input id="msgInput" placeholder="Message..." />
    </div>

    <!-- GIF PANEL -->
    <div id="gifPanel" class="gif-panel hidden">
      <div class="gif-header">
        <input id="gifSearch" placeholder="Search GIFs..."/>
        <button onclick="closeGifPanel()">✕</button>
      </div>
      <div id="gifResults" class="gif-results"></div>
    </div>

    <!-- OWNER BUTTON (auto created) -->
    <div id="ownerBtnContainer"></div>

  </div>

  <!-- USERS -->
  <div class="users">
    <h3>Online</h3>
    <div id="userList"></div>
  </div>

</div>

<!-- OWNER PANEL -->
<div id="ownerPanel" class="owner-panel hidden">
  <div class="owner-header">
    <h2>👑 Owner Panel</h2>
    <button onclick="toggleOwnerPanel()">✕</button>
  </div>

  <button onclick="clearChat()">Clear Chat</button>
  <button onclick="wipeRoom()">Wipe Room</button>
  <button onclick="fakeAnnouncement()">Announcement</button>

  <input id="kickUserInput" placeholder="Kick user"/>
  <button onclick="kickUser()">Kick</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
