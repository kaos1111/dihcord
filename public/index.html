<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini Discord</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login">
  <h2>Welcome Back</h2>
  <input id="usernameInput" placeholder="Enter username"/>
  <button onclick="enterApp()">Enter</button>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <!-- SERVERS -->
  <div class="servers">
    <div class="server">#</div>
  </div>

  <!-- CHANNELS -->
  <div class="channels">
    <h3>TEXT CHANNELS</h3>

    <div class="channel active" onclick="switchRoom('general')">
      # general
    </div>

    <div class="channel" onclick="switchRoom('random')">
      # random
    </div>
  </div>

  <!-- CHAT -->
  <div class="chat">

    <div id="messages" class="messages"></div>

    <div id="typing"></div>

    <!-- INPUT BAR -->
    <div class="input">
      <button id="gifBtn" onclick="toggleGifPanel()">GIF</button>

      <input id="msgInput" placeholder="Message..." />
    </div>

    <!-- GIF PANEL -->
    <div id="gifPanel" class="gif-panel hidden">

      <div class="gif-header">
        <input id="gifSearch" placeholder="Search GIFs..." />
        <button onclick="closeGifPanel()">✖</button>
      </div>

      <div id="gifResults" class="gif-results"></div>
    </div>

  </div>

  <!-- USERS -->
  <div class="users">
    <h3>ONLINE</h3>
    <div id="userList"></div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
<script src="owner-admin.js"></script>
</body>
</html>
