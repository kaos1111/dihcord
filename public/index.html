<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat</title>
<link rel="stylesheet" href="style.css"/>
</head>

<body>

<div id="login" class="login">
  <input id="usernameInput" placeholder="username"/>
  <button onclick="enterApp()">enter</button>
</div>

<div id="app" class="app hidden">

  <div class="sidebar">
    <div onclick="switchRoom('general')">general</div>
    <div onclick="switchRoom('announcements')">announcements</div>
  </div>

  <div class="chat">
    <div id="messages"></div>

    <div class="input">
      <button onclick="toggleGif()">GIF</button>
      <input id="msgInput"/>
    </div>

    <div id="gifPanel" class="gif hidden">
      <input id="gifSearch"/>
      <div id="gifResults"></div>
    </div>
  </div>

  <div id="users"></div>
</div>

<div id="ownerPanel" class="owner hidden">
  <button onclick="sendOwner()">announce</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
