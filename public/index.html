<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Purple Chat</title>
<link rel="stylesheet" href="style.css"/>
</head>

<body>

<!-- LOGIN ONLY SCREEN -->
<div id="login" class="login">
  <div class="login-box">
    <h1>Purple Chat</h1>
    <input id="usernameInput" placeholder="Username"/>
    <button onclick="enterApp()">Enter</button>
  </div>
</div>

<!-- APP (FULL HIDDEN INITIALLY) -->
<div id="app" class="app hidden">

  <div class="sidebar"></div>

  <div class="channels">
    <h3>Channels</h3>
    <div class="channel" onclick="switchRoom('general')"># general</div>
    <div class="channel owner-only" onclick="switchRoom('announcements')"># announcements</div>
  </div>

  <div class="chat">

    <div id="messages" class="messages"></div>

    <!-- INPUT ONLY INSIDE APP -->
    <div class="input-bar">
      <button onclick="toggleGifPanel()">GIF</button>
      <input id="msgInput" placeholder="Message"/>
    </div>

    <!-- GIF PANEL (ONLY APP) -->
    <div id="gifPanel" class="gif-panel hidden">
      <input id="gifSearch" placeholder="Search GIFs..."/>
      <div id="gifResults"></div>
    </div>

  </div>

  <div class="users">
    <h3>Online</h3>
    <div id="userList"></div>
  </div>

</div>

<!-- OWNER PANEL (ALWAYS HIDDEN INITIALLY) -->
<div id="ownerPanel" class="owner-panel hidden">
  <h2>👑 Owner Panel</h2>
  <button onclick="sendOwnerMsg()">Announcement</button>
  <button onclick="toggleOwnerPanel()">Close</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
