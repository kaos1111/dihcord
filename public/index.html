<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Discord</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>Mini Discord</h2>
    <input id="usernameInput" placeholder="Enter username" />
    <button id="enterBtn">Enter</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="sidebar">
    <div class="server-dot active"></div>
  </div>

  <div class="channels">
    <div class="channel" data-room="general"># general</div>
    <div class="channel" data-room="announcements"># announcements 👑</div>
  </div>

  <div class="chat">
    <div id="messages"></div>

    <div class="inputBar">
      <button id="gifBtn">GIF</button>
      <input id="msgInput" placeholder="Message..." />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="users">
    <h4>Online</h4>
    <div id="userList"></div>
  </div>

</div>

<!-- GIF PANEL -->
<div id="gifPanel" class="hidden">
  <input id="gifSearch" placeholder="Search GIFs..." />
  <div id="gifResults"></div>
</div>

<!-- OWNER PANEL -->
<div id="ownerModal" class="hidden">
  <div class="modal">
    <h3>👑 Owner Panel</h3>
    <textarea id="announcementText"></textarea>
    <button id="sendAnnouncement">Send Announcement</button>
    <button id="closeOwner">Close</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
